<svg xmlns="http://www.w3.org/2000/svg" width="48" height="64" viewBox="0 0 48 64" fill="none" role="img" aria-label="Radio antenna marker">
<!-- Copyright Harris Hudson 2026 -->
  <defs>
    <filter id="antennaHalo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Soft white halo behind marker -->
  <g stroke="white" stroke-width="9" stroke-linecap="round"
     stroke-linejoin="round" filter="url(#antennaHalo)">
    <path d="M15.5 8.5a12 12 0 0 0 0 17" />
    <path d="M32.5 8.5a12 12 0 0 1 0 17" />
    <path d="M9.5 3.5a20 20 0 0 0 0 27" />
    <path d="M38.5 3.5a20 20 0 0 1 0 27" />
    <path d="M24 18v43" />
  </g>
  <circle cx="24" cy="15" r="7" fill="white"
          filter="url(#antennaHalo)" />

  <!-- Original antenna artwork -->
  <g stroke="#245f87" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15.5 8.5a12 12 0 0 0 0 17" />
    <path d="M32.5 8.5a12 12 0 0 1 0 17" />
    <path d="M9.5 3.5a20 20 0 0 0 0 27" />
    <path d="M38.5 3.5a20 20 0 0 1 0 27" />
    <path d="M24 18v43" />
  </g>
  <circle cx="24" cy="15" r="4.5" fill="#245f87" />

</svg>
